<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Filmybuzz | Movie Discovery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090a10;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #11131b;
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #c6ff4d;
}

.search {
    display: flex;
    gap: 6px;
}

input {
    padding: 12px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #20212a;
    color: white;
    width: 180px;
}

button {
    padding: 12px 15px;
    background: #c6ff4d;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.hero {
    padding: 65px 6%;
    background: linear-gradient(120deg, #202b29, #11121b 65%);
}

.hero h1 {
    font-size: clamp(36px, 6vw, 60px);
    margin: 0 0 15px;
}

.hero h1 span {
    color: #c6ff4d;
}

.hero p {
    color: #c3c5d0;
    line-height: 1.7;
    max-width: 550px;
}

main {
    padding: 25px 5%;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.categories button {
    background: #20212a;
    color: white;
    border: 1px solid #383a46;
}

.categories button.active,
.categories button:hover {
    background: #c6ff4d;
    color: #111;
}

.movie-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
}

.movie {
    background: #151720;
    border: 1px solid #292b36;
    border-radius: 12px;
    overflow: hidden;
    transition: transform .2s;
}

.movie:hover {
    transform: translateY(-5px);
}

.poster {
    width: 100%;
    height: 230px;
    object-fit: cover;
    background: #252735;
    display: block;
}

.movie-info {
    padding: 12px;
}

.movie h3 {
    font-size: 16px;
    margin: 0 0 9px;
}

.tag {
    color: #c6ff4d;
    font-size: 12px;
}

.movie-info p {
    color: #b7b9c5;
    font-size: 13px;
}

.movie-info a {
    display: block;
    text-align: center;
    text-decoration: none;
    margin-top: 12px;
    padding: 10px;
    border-radius: 6px;
    background: #c6ff4d;
    color: #111;
    font-weight: bold;
    font-size: 13px;
}

#message {
    color: #c6ff4d;
    padding: 20px 0;
}

footer {
    text-align: center;
    padding: 30px 15px;
    background: #11131b;
    color: #b7b9c5;
    margin-top: 35px;
}

@media (max-width: 700px) {
    .movie-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .poster {
        height: 200px;
    }

    header {
        padding: 16px;
    }

    main {
        padding: 20px 14px;
    }

    .hero {
        padding: 45px 20px;
    }

    input {
        width: 150px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎬 Filmybuzz</div>

    <div class="search">
        <input
            type="search"
            id="searchInput"
            placeholder="Search movies..."
        >
        <button onclick="renderMovies()">Search</button>
    </div>
</header>

<section class="hero">
    <h1>Discover Your <span>Next Movie.</span></h1>

    <p>
        Explore Bollywood, Hollywood, South Indian and Hindi
        dubbed movies. Find your next favourite film on Filmybuzz!
    </p>

    <button onclick="document.getElementById('movies')
        .scrollIntoView({behavior:'smooth'})">
        Explore Movies ↓
    </button>
</section>

<main id="movies">

    <h2>🍿 Explore Movies</h2>

    <div class="categories">
        <button class="active" onclick="setCategory('All', this)">All</button>
        <button onclick="setCategory('Bollywood', this)">Bollywood</button>
        <button onclick="setCategory('Hollywood', this)">Hollywood</button>
        <button onclick="setCategory('South Indian', this)">South Indian</button>
        <button onclick="setCategory('Hindi Dubbed', this)">Hindi Dubbed</button>
    </div>

    <div id="movieGrid" class="movie-grid"></div>

    <p id="message"></p>

</main>

<footer>
    <h3>🎬 Filmybuzz</h3>
    <p>Your movie discovery destination.</p>
    <p>© 2026 Filmybuzz</p>
</footer>

<script>
const movies = [
    {
        title: "3 Idiots",
        category: "Bollywood",
        year: 2009,
        genre: "Comedy · Drama",
        poster: "https://image.tmdb.org/t/p/w500/66A9MqXOyVFCssoloscw79z8Tew.jpg"
    },
    {
        title: "Dangal",
        category: "Bollywood",
        year: 2016,
        genre: "Sports · Drama",
        poster: "https://image.tmdb.org/t/p/w500/cJRPOLEexI7qp2DKtFfCh7YaaUG.jpg"
    },
    {
        title: "Jawan",
        category: "Bollywood",
        year: 2023,
        genre: "Action · Thriller",
        poster: "https://image.tmdb.org/t/p/w500/jFt1gS4BGHlK8xt76Y81Alp4dbt.jpg"
    },
    {
        title: "Pathaan",
        category: "Bollywood",
        year: 2023,
        genre: "Action · Spy",
        poster: "https://image.tmdb.org/t/p/w500/arf00BkwvXo0CFKbaD9fWqg6P6K.jpg"
    },
    {
        title: "Inception",
        category: "Hollywood",
        year: 2010,
        genre: "Sci-Fi · Thriller",
        poster: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"
    },
    {
        title: "Interstellar",
        category: "Hollywood",
        year: 2014,
        genre: "Sci-Fi · Adventure",
        poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxfbQq1.jpg"
    },
    {
        title: "The Dark Knight",
        category: "Hollywood",
        year: 2008,
        genre: "Action · Crime",
        poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg"
    },
    {
        title: "Avatar",
        category: "Hollywood",
        year: 2009,
        genre: "Sci-Fi · Adventure",
        poster: "https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg"
    },
    {
        title: "RRR",
        category: "South Indian",
        year: 2022,
        genre: "Action · Drama",
        poster: "https://image.tmdb.org/t/p/w500/nEufeZlyAOLqO2brrs0yeF1lgXO.jpg"
    },
    {
        title: "Baahubali 2",
        category: "South Indian",
        year: 2017,
        genre: "Action · Fantasy",
        poster: "https://image.tmdb.org/t/p/w500/21sC2assImQIYCEDA84Qh9d1RsK.jpg"
    },
    {
        title: "Pushpa 2",
        category: "Hindi Dubbed",
        year: 2024,
        genre: "Action · Crime",
        poster: "https://image.tmdb.org/t/p/w500/1QxJa5Z3N5Q0Q4L3J6W2Q0L6J3J.jpg"
    },
    {
        title: "Kantara",
        category: "Hindi Dubbed",
        year: 2022,
        genre: "Action · Mystery",
        poster: "https://image.tmdb.org/t/p/w500/1s7N1Z4S4L8q9mQ8sQ3mQ0W0g8H.jpg"
    }
];

let selectedCategory = "All";

function setCategory(category, button) {
    selectedCategory = category;

    document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderMovies();
}

function renderMovies() {
    const query = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    const grid = document.getElementById("movieGrid");
    const message = document.getElementById("message");

    const filtered = movies.filter(movie => {
        const matchesCategory =
            selectedCategory === "All" ||
            movie.category === selectedCategory;

        const matchesSearch =
            movie.title.toLowerCase().includes(query) ||
            movie.genre.toLowerCase().includes(query);

        return matchesCategory && matchesSearch;
    });

    grid.innerHTML = "";

    if (filtered.length === 0) {
        message.textContent = "No movies found. Try another search.";
        return;
    }

    message.textContent = "";

    filtered.forEach(movie => {
        const card = document.createElement("article");
        card.className = "movie";

        const poster = document.createElement("img");
        poster.className = "poster";
        poster.src = movie.poster;
        poster.alt = movie.title + " poster";
        poster.loading = "lazy";

        poster.onerror = function() {
            this.style.display = "none";
        };

        const info = document.createElement("div");
        info.className = "movie-info";

        const title = document.createElement("h3");
        title.textContent = movie.title;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = movie.category;

        const details = document.createElement("p");
        details.textContent = movie.year + " · " + movie.genre;

        const trailer = document.createElement("a");
        trailer.textContent = "▶ Watch Trailer";
        trailer.href =
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(movie.title + " official trailer");
        trailer.target = "_blank";
        trailer.rel = "noopener noreferrer";

        info.append(title, tag, details, trailer);
        card.append(poster, info);
        grid.appendChild(card);
    });
}

document.getElementById("searchInput")
    .addEventListener("input", renderMovies);

renderMovies();
</script>

</body>
</html>
